<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Cold-Pressed Orange Juice in a clear glass bottle">
  <defs>
    <linearGradient id="juiceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <linearGradient id="juiceLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="sliceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="80%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <filter id="shadowJ" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5D4037" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#juiceBg)"/>
  <circle cx="300" cy="200" r="150" fill="#FFE082" opacity="0.4"/>
  <ellipse cx="300" cy="355" rx="120" ry="20" fill="#4E342E" opacity="0.15"/>

  <!-- Bottle Group -->
  <g filter="url(#shadowJ)">
    <!-- Cork / Cap -->
    <path d="M280 65 L320 65 L316 85 L284 85 Z" fill="#8D6E63"/>
    <rect x="282" y="85" width="36" height="8" rx="2" fill="#6D4C41"/>

    <!-- Glass Bottle Neck -->
    <path d="M285 93 L315 93 L315 130 C315 150 345 165 355 195 L355 330 C355 342 345 350 332 350 L268 350 C255 350 245 342 245 330 L245 195 C255 165 285 150 285 130 Z" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Juice Fill inside bottle -->
    <path d="M287 138 L313 138 C313 152 342 166 351 195 L351 328 C351 338 343 346 332 346 L268 346 C257 346 249 338 249 328 L249 195 C258 166 287 152 287 138 Z" fill="url(#juiceLiquid)"/>

    <!-- Bottle Label -->
    <rect x="254" y="210" width="92" height="75" rx="6" fill="#FFFFFF" stroke="#FFCC80" stroke-width="1.5"/>
    <text x="300" y="232" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800" fill="#E65100" text-anchor="middle" letter-spacing="1">ORANGE CITY</text>
    <text x="300" y="247" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="middle">PURE JUICE</text>
    <line x1="265" y1="254" x2="335" y2="254" stroke="#FFE0B2" stroke-width="1"/>
    <text x="300" y="267" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#5D4037" text-anchor="middle">COLD-PRESSED • 500 ML</text>
    <text x="300" y="278" font-family="Segoe UI, sans-serif" font-size="7.5" fill="#757575" text-anchor="middle">NO ADDED SUGAR</text>

    <!-- Glass Reflection Highlights -->
    <path d="M255 200 L255 320" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M265 195 L265 205" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Orange slice leaning beside bottle -->
  <g filter="url(#shadowJ)" transform="translate(390, 290) rotate(20)">
    <circle cx="0" cy="0" r="50" fill="#EF6C00"/>
    <circle cx="0" cy="0" r="45" fill="#FFE082"/>
    <circle cx="0" cy="0" r="39" fill="url(#sliceGlow)"/>
    <circle cx="0" cy="0" r="7" fill="#FFFDE7"/>
    <!-- Segment rays -->
    <line x1="0" y1="0" x2="0" y2="-39" stroke="#FFE082" stroke-width="2"/>
    <line x1="0" y1="0" x2="28" y2="-28" stroke="#FFE082" stroke-width="2"/>
    <line x1="0" y1="0" x2="39" y2="0" stroke="#FFE082" stroke-width="2"/>
    <line x1="0" y1="0" x2="28" y2="28" stroke="#FFE082" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="39" stroke="#FFE082" stroke-width="2"/>
    <line x1="0" y1="0" x2="-28" y2="28" stroke="#FFE082" stroke-width="2"/>
    <line x1="0" y1="0" x2="-39" y2="0" stroke="#FFE082" stroke-width="2"/>
    <line x1="0" y1="0" x2="-28" y2="-28" stroke="#FFE082" stroke-width="2"/>
  </g>

  <!-- Green leaf -->
  <path d="M380 230 C420 200 450 210 460 230 C440 250 400 250 380 230 Z" fill="#43A047"/>
  <path d="M380 230 C420 220 445 225 455 230" stroke="#1B5E20" stroke-width="1.5" fill="none"/>

  <!-- Vitamin C Badge -->
  <g transform="translate(42, 38)">
    <circle cx="36" cy="36" r="30" fill="#E65100"/>
    <circle cx="36" cy="36" r="27" fill="#FF9800"/>
    <text x="36" y="32" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">RICH IN</text>
    <text x="36" y="47" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">VIT C</text>
  </g>
</svg>
